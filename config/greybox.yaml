# Coupled six-joint grey-box identification for the deployed Isaac Lab 3.0
# Newton/MJWarp arm: IdealPD effort every 5 ms tick, command delay in ticks,
# joint armature and frictionloss, zero passive damping, gravity neutral.
schema_version: 1
data:
  runs:
    - ../data/20260605_001412/csv
    - ../data/20260611_201935/csv
  command_source: smooth
  sample_dt: 0.01
  discard_start_s: 2.0
  derivative_window: 15
  derivative_polyorder: 3
  train_fraction: 0.7
  split_gap_s: 0.3
plant:
  source_xml: ../models/b2arx.xml
  baseline: baselines/pd_20260605.yaml
  fixed_pose: [0.0, 1.0, 0.8, 0.0, 0.0, 0.0]
  physics_dt: 0.005
  gravity: [0.0, 0.0, 0.0]
fit:
  window_s: 1.5
  stride_s: 0.5
  max_delay_s: 0.15
  iterations: 500
  delay_refit_iterations: 150
  learning_rate: 0.03
  friction_iterations: 5
  threads_per_worker: 1
  initial_armature: 0.0001
  initial_friction: 0.01
  # Candidate model structures, simplest first; the chirp validation blocks pick one.
  # friction_impedance is the frictionloss constraint's solimp d0: MuJoCo's 0.9
  # lets a loaded joint creep, values near 1 hold it like real stiction.
  # bias is a constant per-joint offset of the held position from the command
  # (encoder zero or residual gravity compensation), applied to the target.
  # Armature is not fitted: position data cannot separate it from kp/kd/friction.
  variants:
    pd: [kp, kd, delay_s]
    pd_friction: [kp, kd, delay_s, friction]
    pd_stiction: [kp, kd, delay_s, friction, friction_impedance]
    pd_stiction_bias: [kp, kd, delay_s, friction, friction_impedance, bias]
validation:
  # A richer structure must beat the simplest acceptable one by more than this
  # fraction of the all-joint validation RMSE to be chosen.
  selection_tolerance: 0.05
  # Each held-out step trajectory must keep the active joint's position RMSE
  # within this ratio of the deployed baseline to accept a replacement.
  allowed_rmse_ratio: 1.05
runtime:
  python: '3.12'
  newton: '1.6'
  torch: '2.11'
  warp: '1.17'
  mujoco: '3.12'
