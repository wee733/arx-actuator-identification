schema_version: 1
data:
  runs:
    - ../data/20260605_001412/csv
    - ../data/20260611_201935/csv
  command_source: smooth
  sample_dt: 0.01
  discard_start_s: 2.0
  derivative_window: 15
  derivative_polyorder: 3
  train_fraction: 0.7
  split_gap_s: 0.3
plant:
  source_xml: ../models/b2arx.xml
  baseline: baselines/pd_20260605.yaml
  fixed_pose: [0.0, 1.0, 0.8, 0.0, 0.0, 0.0]
  physics_dt: 0.005
  gravity: [0.0, 0.0, 0.0]
  joint_armature: 0.0
network:
  joints: [1, 2, 3, 4, 5, 6]
  input_idx: [0, 1, 2]
  input_order: pos_vel
  hidden_size: 32
training:
  seed: 42
  device: cuda:0
  epochs: 600
  learning_rate: 0.003
  weight_decay: 0.00001
  pd_prior_weight: 0.01
  inverse_dynamics_batch: 128
  trajectory_epochs: 200
  trajectory_steps: 64
  trajectory_batch: 64
  trajectory_learning_rate: 0.0005
  stability_weight: 0.05
  equilibrium_weight: 0.05
validation:
  allowed_rmse_ratio: 1.05
  max_tracking_error_rad: 0.15
runtime:
  python: '3.12'
  newton: '1.6'
  torch: '2.11'
  warp: '1.17'
  mujoco: '3.12'
