# Fast MuJoCo prior config for Isaac refinement.
#
# Same modeling assumptions as arx_r5_smooth_pd_identify.yaml, but fewer random
# samples. Use this when MuJoCo is only a coarse prior generator and Isaac will do
# the final batch refinement.

delay_steps_candidates: [0, 1, 2, 3, 4, 5, 8]
filter_alpha_candidates: [1.0]
time_shift_candidates: [0]
tau_lag_alpha_candidates: [1.0]

kp_bounds: [0.1, 1000.0]
kd_bounds: [0.0, 100.0]
tau_limit_bounds: [64.0, 64.0]
max_kd_over_kp: 0.25

w_q: 1.0
w_qd: 0.25
w_reg_kp: 0.0
w_reg_tau: 0.0

# 重力补偿关闭(纯 PD):真机固件已补重力,q_real 是重力中性轨迹;MuJoCo 纯 PD 拟 j2/j3/j4
# 比加 +G 好 6~17 倍;Isaac 也实测中性。详见完整配置 arx_r5_smooth_pd_identify.yaml 注释。
gravity_compensation: false
gravity_scale_candidates: [0.0]
w_reg_gravity_scale: 0.01

random_seed: 42
random_samples: 200

# Isaac coarse-to-fine 迭代精修(与完整配置同语义，仅 MuJoCo prior 更快)。
refinement_rounds: 4
refine_shrink: 0.5
refine_candidates_per_round: null
